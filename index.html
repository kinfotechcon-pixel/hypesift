<body>
<div class="wrap">
  <div class="bar">
    <a class="brand" href="#" id="home" aria-label="Hypesift home">
      <svg viewBox="0 0 38 38" role="img" aria-label="Hypesift logo: a sun with a check mark">
        <circle cx="19" cy="19" r="18" fill="#ffbe0b"/>
        <circle cx="24.5" cy="24.5" r="9" fill="#ff6f59"/>
        <path d="M10 19l5.5 5.5 11-12" fill="none" stroke="#3a1f3d" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="word"><i>Hype</i><b>sift</b></span>
    </a>
    <div class="navs">
      <button class="nav" id="navBack" type="button" hidden aria-label="Leave this game and go back">&larr; Back</button>
      <div class="hud" id="hud" hidden>
        <span><span id="hLabel">Case</span> <strong id="hCase">1</strong>/<span id="hTotal">8</span></span>
        <span class="hide-s">Score <strong id="hScore">0</strong></span>
      </div>
      <button class="nav" id="navHow" type="button">How it works</button>
      <button class="nav" id="navInbox" type="button" hidden>Inbox</button>
      <button class="nav" id="navComm" type="button" hidden>Board</button>
      <button class="nav" id="navProfile" type="button">Profile</button>
    </div>
  </div>
  <div class="dots" id="dots" hidden></div>

  <main id="app"></main>
  <p class="foot">Every claim is checked against its linked source.</p>
</div>
<div class="toast" id="toast" role="status" hidden></div>
