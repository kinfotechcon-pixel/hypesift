<div class="wrap">

    <a class="brand" href="#" id="home" aria-label="Hypesift home">
      <svg viewBox="0 0 64 64" role="img" aria-label="Hypesift logo: a noisy signal passes through a filter and comes out as a clean wave">
        <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="#131b2f" stroke="#27345a" stroke-width="2"/>
        <path d="M8 33 L11 21 L14 43 L17 17 L20 46 L23 25 L26 38" fill="none" stroke="#ff7a6b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

      <span class="word"><i>Hype</i><b>sift</b></span>
    </a>
    <div class="navs">
      <div class="hud" id="hud" hidden>
        <span>Case <strong id="hCase">1</strong>/<span id="hTotal">8</span></span>

      <button class="nav" id="navProfile" type="button">Profile</button>
    </div>

  <main id="app"></main>
